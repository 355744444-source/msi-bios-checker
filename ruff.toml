# ruff 配置 —— 微星主板 BIOS 下载工具
#
# 为什么需要这份文件：
#   ruff 0.17 的**默认规则集已扩张到 409 条**（含 YTT/ASYNC/FURB 等第三方插件规则）。
#   在没有配置的情况下对全仓跑一次，会得到 3000+ 条命中，其中 96% 是本工程一贯的
#   写法（宽捕获、% 延迟格式化、中文全角标点）。噪声大到一个程度，就等于"不看 lint"——
#   真正的问题（这次抓到的 F823 未绑定局部变量）会被埋在 3000 行里没人看得见。
#
#   所以这份配置的定位是：**收窄到缺陷集，剩下的才值得人看**。它不是"把警报关掉"，
#   而是把已经知情并接受的历史写法显式登记，让 `ruff check .` 的输出重新变成信号。
#
# 用法：
#   python -m ruff check .              # 应输出 0 条
#   python -m ruff check . --fix        # 自动修可安全修复的项

target-version = "py313"

# 110 留白：本工程有较多"参数说明 + 默认值"的长签名，100 会逼出无意义的折行。
line-length = 110

cache-dir = ".ruff_cache"

# archive/ 里是历史发布物与归档的发版脚本，不属于当前维护面；
# _testenv/ 是门禁用的 curl_cffi 替身（无真实逻辑）；
# _gatelog/ 是门禁产出的文本日志。
extend-exclude = [
    "archive",
    "dist",
    "_testenv",
    "_gatelog",
    "build_v*",
]


[lint]
select = ["E4", "E7", "E9", "F", "B", "PLE", "PLW"]

# 只选"会变成 bug 或明显错误"的类别：
#   E4/E7/E9  pycodestyle 的 import / 语句 / 运行时错误级
#   F         pyflakes：未定义名、未使用导入、重复定义、未绑定局部变量
#   B         bugbear：可变默认参数、闭包晚绑定、循环内变量覆盖等真 bug 模式
#   PLE/PLW   pylint 的错误与警告（逻辑级，不含风格级 PLR/PLR09xx）
#
# 刻意**不选**的四类（都是本工程有意为之的写法，选了只会产生噪声）：
#   UP  (pyupgrade)        —— 日志统一用 `%` 延迟格式化，改 f-string 会让日志参数
#                              在未输出时也被求值；UP031 单独命中 142 处。
#   S   (bandit)           —— GUI 程序需要宽捕获兜住动画回调异常；S110 `except: pass`
#                              65 处都是"清理失败不值得崩"的场景。
#   BLE (blind-except)     —— 同上，BLE001 142 处。
#   RUF001/002/003         —— 把中文全角标点判为"歧义 Unicode"，4581 处纯噪声。
ignore = [
    # 模块级单例状态（DPI、字体缓存、颜色令牌、Tk 根窗口）是本工具的设计选择。
    # 21 处 global 若改为传参，会让 5400 行的 UI 代码到处多带一个 ctx 参数。
    "PLW0603",
    # 门禁探针必须"先注入 stub / 改 sys.path，再 import 被测模块"，
    # import 无法整体置顶。产品源码 msi_bios_checker.py 本身无此问题。
    "E402",
    # subprocess.run 在这里是**为了读 returncode 判定成败**（门禁要区分
    # "断言失败 rc=1" 与 "解释器崩溃 rc=3221225477"），加 check=True 会抛异常
    # 而不是留下可比较的返回码，改变语义。
    "PLW1510",
]


[lint.per-file-ignores]
# 探针脚本（_p_*）与优化对照脚本（_opt_*）：一次性诊断工具，不是产品代码。
# 它们大量使用 l/i/j 这类循环下标、临时变量占位、嵌套 min，
# 按产品代码标准要求它们是过度约束。
"_p_*.py" = ["E741", "B905", "B007", "PLW3301", "E731", "F841"]
"_opt_*.py" = ["E741", "B905", "B007", "E731"]

# 产品源码的 2 条，是**知情未修**而非"没问题"：
#   1588 行 PLW2901 `for sub in ...` 循环体内又被赋值（拆分 BIos 版本后缀时的复用变量）
#   5413 行 B007    循环变量 b 未使用（解包占位）
# 它们是纯变量命名问题、无功能影响，改动会改变源码字节 ——
# 而当前源码必须与 dist 里的 v2.5.3 冻结产物保持同源（_rel_frozen_verify253 会逐符号比对）。
# 留到下一个版本一并清理，届时删掉本行即可。
"msi_bios_checker.py" = ["PLW2901", "B007"]
